[project]
name = "patufet"
version = "0.1.0"
description = "Raspberry Pi server for voice assistant processing"
authors = [{name = "sebastianrosenzweig"}]
requires-python = ">= 3.13"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "requests",
    "faster-whisper",
    "av < 19.0.0",
    "llama-cpp-python",
    "soundfile",
    "piper-tts",
    "huggingface_hub"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["unittests"]
pythonpath = ["src"]

[tool.poetry]
packages = [{ include = "patufet", from = "src" }]
