[project]
name = "patufet"
version = "0.1.0"
description = "Raspberry Pi server for voice assistant processing"
authors = [{name = "sebastianrosenzweig"}]
requires-python = ">= 3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "python-multipart",
    "faster-whisper",
    "av < 19.0.0",
    "pytest"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.poetry]
package-mode = false
